[tool.poetry]
name = "data-transformer"
version = "0.2.0"
description = "A web-based data transformation tool for data engineers. Load, transform, and export tabular data with Python scripts."
authors = ["Thomas <thomas.stefen@sg-edts.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
streamlit = ">=1.54.0"
pandas = ">=2.3.3"
openpyxl = ">=3.1.5"
numpy = ">=2.0"
polars = ">=1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
